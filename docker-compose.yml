# Start everything:          docker compose up -d --build
# Run the batch history job:  docker compose run --rm batch

# Connection settings for code running inside Docker, where "localhost" is the
# container itself. They replace the matching .env values.
x-docker-env: &docker-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  POSTGRESQL_HOST: postgres
  POSTGRESQL_PORT: "5432"
  SCHEMA_REGISTRY_URL: http://schema-registry:8081

# Shared settings for every service built from this project's Dockerfile.
# (No shared "image:" name: several services building one tag in parallel collide.
# Each service gets its own tag, but they share every layer.)
x-app: &app
  build: .
  env_file: .env
  environment:
    <<: *docker-env
  volumes:
    - ./data:/app/data
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully

services:

  postgres:
    image: postgres:18
    container_name: riskcoin_postgres

    # Start again automatically whenever Docker Desktop starts,
    # unless you stopped it yourself with docker stop
    restart: unless-stopped

    environment:

      POSTGRES_DB: ${POSTGRESQL_DB:-RiskCoin}
      POSTGRES_USER: ${POSTGRESQL_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:?Set POSTGRESQL_PASSWORD in .env}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: riskcoin_kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    # Single-node KRaft: one container is both broker and controller (no ZooKeeper).
    # Two client listeners: localhost:9092 for scripts on your Mac,
    # kafka:29092 for the other containers.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    # Topics, messages and consumer offsets survive docker compose down / up
    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates the topics, then exits. Safe on every start (--if-not-exists).
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic crypto.prices.raw --partitions 6 --replication-factor 1 \
          --config retention.ms=86400000 --config segment.ms=3600000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic crypto.prices.dlq --partitions 1 --replication-factor 1 \
          --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic crypto.prices.avro --partitions 6 --replication-factor 1 \
          --config retention.ms=86400000 --config segment.ms=3600000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic crypto.smoke_test --partitions 3 --replication-factor 1 \
          --config retention.ms=3600000 &&
        echo "Topics ready"
    restart: "no"

  # Step 49: stores Avro schema versions (in Kafka's _schemas topic) and checks
  # every new version for compatibility. HTTP API: http://localhost:8081
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.10
    container_name: riskcoin_schema_registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Registers schemas/price_event.avsc (after a compatibility check), then exits.
  # The producer can't register schemas itself (auto.register.schemas is off).
  schema-init:
    <<: *app
    command: python -m src.streaming.register_schema
    restart: "no"
    depends_on:
      schema-registry:
        condition: service_healthy

  producer:
    <<: *app
    command: python -m src.streaming.producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully

  consumer:
    <<: *app
    command: python -m src.streaming.consumer
    environment:
      <<: *docker-env
      # Read the Avro topic (rollback: remove this line and restart the consumer)
      EVENT_FORMAT: avro
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
    # Time to finish the current batch, flush and commit after SIGTERM
    stop_grace_period: 45s

  live-risk:
    <<: *app
    command: python -m src.jobs.compute_live_risk --every 300

  # Step 46: Dagster runs the batch work on schedules, with retries and run history:
  # the coin catalog, the CoinGecko history (main.py), dbt and a stream freshness check.
  # UI: http://localhost:3000. Schedules start switched off; turn them on once in the UI.
  dagster:
    <<: *app
    command: >
      sh -c "cp orchestration/dagster.yaml $$DAGSTER_HOME/ &&
      exec dagster dev -h 0.0.0.0 -p 3000 -m orchestration.definitions"
    environment:
      <<: *docker-env
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DAGSTER_HOME: /opt/dagster/home
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - dagster_home:/opt/dagster/home

  # Step 43: Streamlit dashboard at http://localhost:8501
  dashboard:
    <<: *app
    command: >
      streamlit run app/dashboard.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
      --browser.gatherUsageStats=false
    ports:
      - "8501:8501"

  # Only runs when asked: docker compose run --rm batch
  batch:
    <<: *app
    command: python main.py
    restart: "no"
    profiles: ["batch"]

  # Step 48: Spark Structured Streaming shadow job (bars -> price_bars_1m_spark).
  # Spark UI while it runs: http://localhost:4040
  spark-bars:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: riskcoin-spark
    env_file: .env
    environment:
      <<: *docker-env
    ports:
      - "4040:4040"
    volumes:
      # The checkpoint (Kafka offsets + window state) must survive container recreation
      - spark_checkpoints:/opt/spark/work-dir/checkpoints
      # Cache of the Kafka connector Spark downloads at startup
      - spark_ivy:/opt/spark/work-dir/.ivy2.5.2
    restart: unless-stopped
    mem_limit: 1500m
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  kafka_data:
  spark_checkpoints:
  spark_ivy:
  dagster_home:
