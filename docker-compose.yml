services:

  postgres:
    image: postgres:18
    container_name: riskcoin_postgres

    # Start again automatically whenever Docker Desktop starts,
    # unless you stopped it yourself with docker stop
    restart: unless-stopped

    environment:

      POSTGRES_DB: ${POSTGRESQL_DB:-RiskCoin}
      POSTGRES_USER: ${POSTGRESQL_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:?Set POSTGRESQL_PASSWORD in .env}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  kafka:
    image: apache/kafka:3.8.0
    container_name: riskcoin_kafka

    ports:
      - "9092:9092"

    # Single-node KRaft: one container is both broker and controller (no ZooKeeper).
    # Messages live inside the container: docker compose stop/start keeps them,
    # docker compose down deletes them.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

volumes:
  postgres_data:
