services:

  postgres:
    image: postgres:18
    container_name: riskcoin_postgres

    environment:
      POSTGRES_DB: ${POSTGRESQL_DB:-RiskCoin}
      POSTGRES_USER: ${POSTGRESQL_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:?Set POSTGRESQL_PASSWORD in .env}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: