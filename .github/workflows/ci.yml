name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: riskcoin
          POSTGRES_PASSWORD: riskcoin
          POSTGRES_DB: riskcoin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskcoin -d riskcoin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials that only exist inside this CI run
      TEST_DATABASE_URL: postgresql+psycopg2://riskcoin:riskcoin@localhost:5432/riskcoin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q tests/test_db_upserts.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build -t riskcoin-app .
