# The live stream: src/streaming/producer.py polls CoinGecko's /coins/markets
# (one request returns every tracked coin) and publishes one event per coin to Kafka.
# Which coins: the same top_n list as the batch job (config/coins.yaml).

# CoinGecko's free Demo plan allows about 10,000 calls a month. Polling every
# 10 minutes is about 4,300 a month, which leaves room for the daily batch
# (about 3,100) and the coin catalog (about 120). CoinGecko itself refreshes
# these prices only every minute or so, so polling much faster gains little.
poll_interval_seconds: 600

kafka:
  bootstrap_servers: localhost:9092
  topic: crypto.prices.raw
  dlq_topic: crypto.prices.dlq
  avro_topic: crypto.prices.avro
